<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// renderer / scene / camera
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(5.6, 3.6, 9.2);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 5;
controls.maxDistance = 18;
controls.minPolarAngle = 0.4;
controls.maxPolarAngle = Math.PI / 2 + 0.05;
controls.enablePan = false;

// SKY
function makeSkyTexture() {
  const w = 1024, h = 1024;
  const canv = document.createElement('canvas');
  canv.width = w; canv.height = h;
  const ctx = canv.getContext('2d');

  const grd = ctx.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0.00, '#1a1145');
  grd.addColorStop(0.18, '#3b1d6b');
  grd.addColorStop(0.38, '#a23a8a');
  grd.addColorStop(0.55, '#ef5d6a');
  grd.addColorStop(0.72, '#ff9c52');
  grd.addColorStop(0.86, '#ffd58a');
  grd.addColorStop(1.00, '#ffe7b0');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, w, h);

  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 90; i++) {
    const y = Math.random() * h * 0.28;
    const x = Math.random() * w;
    const r = Math.random() * 1.4 + 0.3;
    ctx.globalAlpha = 0.4 + Math.random() * 0.55;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  function puff(cx, cy, rx, ry, color, alpha) {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
    g.addColorStop(0, color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(cx, cy);
    ctx.scale(rx / 100, ry / 100);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 100, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  puff(180, 640, 320, 70, '#ffc6e0', 0.85);
  puff(540, 600, 380, 80, '#ffd9b8', 0.9);
  puff(820, 660, 260, 60, '#ffb3c1', 0.8);
  puff(330, 720, 260, 50, '#ffe0c2', 0.95);
  puff(720, 740, 300, 55, '#ffd2a8', 0.95);
  puff(140, 380, 240, 38, '#d6b6ff', 0.55);
  puff(620, 420, 300, 40, '#e5b8ff', 0.5);
  puff(880, 460, 200, 35, '#c9a8ff', 0.45);
  for (let i = 0; i < 14; i++) {
    puff(Math.random()*w, 500 + Math.random()*250,
         40 + Math.random()*60, 14 + Math.random()*16,
         '#fff1d9', 0.4 + Math.random()*0.3);
  }

  // HOT PINK SUN — large, with magenta halo and coral outer glow
  const sunY = h * 0.78, sunX = w * 0.62;
  const sunOuter = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 460);
  sunOuter.addColorStop(0,    'rgba(255, 90, 170, 0.9)');
  sunOuter.addColorStop(0.35, 'rgba(255, 70, 150, 0.55)');
  sunOuter.addColorStop(0.7,  'rgba(255, 130, 130, 0.25)');
  sunOuter.addColorStop(1,    'rgba(255, 130, 130, 0)');
  ctx.fillStyle = sunOuter;
  ctx.beginPath(); ctx.arc(sunX, sunY, 460, 0, Math.PI*2); ctx.fill();
  // hot pink core
  const core = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 200);
  core.addColorStop(0,   '#fff0f5');
  core.addColorStop(0.18,'#ff9ed1');
  core.addColorStop(0.55,'#ff3aa0');
  core.addColorStop(1,   '#ff1f86');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(sunX, sunY, 200, 0, Math.PI*2); ctx.fill();
  // sun ring
  ctx.strokeStyle = 'rgba(255,180,220,0.5)';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(sunX, sunY, 230, 0, Math.PI*2); ctx.stroke();

  const tex = new THREE.CanvasTexture(canv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.mapping = THREE.EquirectangularReflectionMapping;
  return tex;
}

{
  const skyGeo = new THREE.SphereGeometry(80, 48, 32);
  const skyMat = new THREE.MeshBasicMaterial({
    map: makeSkyTexture(),
    side: THREE.BackSide,
    depthWrite: false,
  });
  const sky = new THREE.Mesh(skyGeo, skyMat);
  sky.rotation.y = Math.PI * 0.15;
  scene.add(sky);
}

scene.fog = new THREE.Fog('#f3a07a', 28, 80);

// LIGHTS
scene.add(new THREE.HemisphereLight('#ffd9b3', '#3a2255', 0.85));

const sun = new THREE.DirectionalLight('#ffb98a', 1.6);
sun.position.set(7, 5, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 30;
sun.shadow.camera.left = -8;
sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8;
sun.shadow.camera.bottom = -8;
sun.shadow.bias = -0.0005;
scene.add(sun);

const rim = new THREE.DirectionalLight('#ff7ab8', 0.55);
rim.position.set(-5, 3, -4);
scene.add(rim);

const fill = new THREE.PointLight('#a07cff', 0.4, 18);
fill.position.set(-3, 2.4, 3);
scene.add(fill);

// grass texture
function makeGrassTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#5fa84a'; ctx.fillRect(0,0,256,256);
  for (let i=0;i<2200;i++){
    const x = Math.random()*256, y = Math.random()*256;
    const shades = ['#7cc862','#3f8a36','#a8d76f','#4d9a3e','#6bb84f'];
    ctx.strokeStyle = shades[i % shades.length];
    ctx.lineWidth = 0.8 + Math.random()*0.7;
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x + (Math.random()-0.5)*1.5, y - 2 - Math.random()*2);
    ctx.stroke();
  }
  for (let i=0;i<24;i++){
    const x = Math.random()*256, y = Math.random()*256;
    ctx.fillStyle = ['#ffd1e8','#fff4a0','#ffffff','#ffb6e1'][i%4];
    ctx.beginPath(); ctx.arc(x,y,1.4,0,Math.PI*2); ctx.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(3,3);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// FLOATING ISLAND
const islandGroup = new THREE.Group();
scene.add(islandGroup);

{
  const rockGeo = new THREE.ConeGeometry(2.6, 2.8, 16, 4, false);
  const pos = rockGeo.attributes.position;
  for (let i=0;i<pos.count;i++){
    const y = pos.getY(i);
    if (y < 1.0) {
      pos.setX(i, pos.getX(i) + (Math.random()-0.5)*0.25);
      pos.setZ(i, pos.getZ(i) + (Math.random()-0.5)*0.25);
      pos.setY(i, y + (Math.random()-0.5)*0.18);
    }
  }
  rockGeo.computeVertexNormals();
  const rockMat = new THREE.MeshStandardMaterial({ color:'#6b4a3a', roughness:0.95, flatShading:true });
  const rock = new THREE.Mesh(rockGeo, rockMat);
  rock.position.y = -0.4;
  rock.rotation.y = Math.PI;
  rock.castShadow = true; rock.receiveShadow = true;
  islandGroup.add(rock);
}

for (let i=0;i<6;i++){
  const ang = (i/6)*Math.PI*2;
  const len = 0.4 + Math.random()*0.5;
  const root = new THREE.Mesh(
    new THREE.CylinderGeometry(0.04, 0.01, len, 6),
    new THREE.MeshStandardMaterial({color:'#3a2418', roughness:1})
  );
  root.position.set(Math.cos(ang)*1.6, -1.5 - len/2, Math.sin(ang)*1.6);
  root.rotation.z = (Math.random()-0.5)*0.3;
  islandGroup.add(root);
}

{
  const grassGeo = new THREE.CylinderGeometry(2.7, 2.55, 0.45, 32);
  const grassMat = new THREE.MeshStandardMaterial({
    map: makeGrassTexture(), roughness: 0.9, color:'#8fcf6c'
  });
  const grass = new THREE.Mesh(grassGeo, grassMat);
  grass.position.y = 0.85;
  grass.receiveShadow = true; grass.castShadow = true;
  islandGroup.add(grass);

  for (let i=0;i<60;i++){
    const r = Math.random() * 2.4;
    const a = Math.random()*Math.PI*2;
    const blade = new THREE.Mesh(
      new THREE.ConeGeometry(0.04, 0.18 + Math.random()*0.12, 4),
      new THREE.MeshStandardMaterial({color: ['#7cc862','#5fa84a','#a8d76f'][i%3], roughness:1})
    );
    blade.position.set(Math.cos(a)*r, 1.15, Math.sin(a)*r);
    blade.rotation.z = (Math.random()-0.5)*0.4;
    islandGroup.add(blade);
  }

  for (let i=0;i<7;i++){
    const r = 0.5 + Math.random()*1.7;
    const a = Math.random()*Math.PI*2;
    const stem = new THREE.Mesh(
      new THREE.CylinderGeometry(0.02,0.02,0.18,5),
      new THREE.MeshStandardMaterial({color:'#3f8a36'})
    );
    stem.position.set(Math.cos(a)*r, 1.18, Math.sin(a)*r);
    islandGroup.add(stem);
    const flower = new THREE.Mesh(
      new THREE.SphereGeometry(0.07, 8, 6),
      new THREE.MeshStandardMaterial({color: ['#ffd1e8','#fff4a0','#ffb6e1','#ffffff'][i%4], roughness:0.7})
    );
    flower.position.set(stem.position.x, 1.32, stem.position.z);
    islandGroup.add(flower);
  }
}

// NEW ORLEANS SKYLINE
function makeSkyline() {
  const g = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color: '#2a1840', fog: true });
  const matFar = new THREE.MeshBasicMaterial({ color: '#52315e', fog: true });

  const ringR = 22;
  const buildings = [
    { type:'shotgun', x:-9, w:1.6, h:1.2 },
    { type:'shotgun', x:-7, w:1.4, h:1.0 },
    { type:'shotgun', x:-5.4, w:1.5, h:1.1 },
    { type:'shotgun', x:-3.6, w:1.6, h:1.3 },
    { type:'cathedral', x:-1.4, w:2.4, h:2.4 },
    { type:'office', x:1.8, w:1.0, h:3.4 },
    { type:'office', x:3.0, w:1.2, h:3.0 },
    { type:'office', x:4.4, w:0.9, h:2.6 },
    { type:'boat', x:6.6, w:2.6, h:1.6 },
    { type:'shotgun', x:9.4, w:1.5, h:1.1 },
  ];

  buildings.forEach(b => {
    const angle = Math.atan2(b.x, ringR);
    const px = Math.sin(angle) * ringR;
    const pz = -Math.cos(angle) * ringR;

    if (b.type === 'shotgun') {
      const body = new THREE.Mesh(new THREE.BoxGeometry(b.w, b.h, 0.6), mat);
      body.position.set(px, b.h/2 - 0.5, pz);
      g.add(body);
      const roof = new THREE.Mesh(new THREE.ConeGeometry(b.w*0.78, 0.5, 4), mat);
      roof.rotation.y = Math.PI/4;
      roof.position.set(px, b.h - 0.5 + 0.25, pz);
      g.add(roof);
      const chim = new THREE.Mesh(new THREE.BoxGeometry(0.12,0.4,0.12), mat);
      chim.position.set(px - b.w*0.3, b.h - 0.3, pz);
      g.add(chim);
    } else if (b.type === 'cathedral') {
      const body = new THREE.Mesh(new THREE.BoxGeometry(b.w, b.h*0.7, 0.8), mat);
      body.position.set(px, b.h*0.35 - 0.5, pz);
      g.add(body);
      const gable = new THREE.Mesh(new THREE.ConeGeometry(b.w*0.6, 0.5, 3), mat);
      gable.rotation.y = Math.PI/6;
      gable.position.set(px, b.h*0.7 - 0.5 + 0.25, pz);
      g.add(gable);
      for (let s=-1;s<=1;s++) {
        const spire = new THREE.Mesh(new THREE.ConeGeometry(0.18, 1.4 + (s===0?0.4:0), 8), mat);
        spire.position.set(px + s*b.w*0.4, b.h*0.7 - 0.5 + 0.7 + (s===0?0.2:0), pz);
        g.add(spire);
      }
    } else if (b.type === 'office') {
      const body = new THREE.Mesh(new THREE.BoxGeometry(b.w, b.h, 0.7), matFar);
      body.position.set(px, b.h/2 - 0.5, pz);
      g.add(body);
      const cap = new THREE.Mesh(new THREE.BoxGeometry(b.w*0.5, 0.25, 0.4), matFar);
      cap.position.set(px, b.h - 0.5 + 0.12, pz);
      g.add(cap);
    } else if (b.type === 'boat') {
      const hull = new THREE.Mesh(new THREE.BoxGeometry(b.w, b.h*0.6, 0.8), mat);
      hull.position.set(px, b.h*0.3 - 0.5, pz);
      g.add(hull);
      const tier = new THREE.Mesh(new THREE.BoxGeometry(b.w*0.7, b.h*0.4, 0.7), mat);
      tier.position.set(px, b.h*0.6 - 0.5 + b.h*0.2, pz);
      g.add(tier);
      const s1 = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.12,1.0,8), mat);
      s1.position.set(px-0.4, b.h*0.6 + 0.5, pz);
      g.add(s1);
      const s2 = s1.clone(); s2.position.x = px+0.4; g.add(s2);
      [s1, s2].forEach(s => {
        const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.12,0.18,8), mat);
        crown.position.set(s.position.x, s.position.y+0.55, s.position.z);
        g.add(crown);
      });
    }
  });

  const lightMat = new THREE.MeshBasicMaterial({color:'#ffe9a8'});
  for (let i=0;i<40;i++){
    const x = -10 + Math.random()*20;
    const y = 0.2 + Math.random()*2.2;
    const angle = Math.atan2(x, ringR);
    const px = Math.sin(angle) * (ringR-0.5);
    const pz = -Math.cos(angle) * (ringR-0.5);
    const dot = new THREE.Mesh(new THREE.PlaneGeometry(0.05,0.08), lightMat);
    dot.position.set(px, y - 0.5, pz);
    dot.lookAt(0,1,0);
    g.add(dot);
  }

  const water = new THREE.Mesh(
    new THREE.PlaneGeometry(80, 40),
    new THREE.MeshBasicMaterial({ color: '#7d3a6e', fog: true, transparent:true, opacity:0.85 })
  );
  water.rotation.x = -Math.PI/2;
  water.position.set(0, -2.4, -10);
  g.add(water);

  const bridgeMat = new THREE.MeshBasicMaterial({color:'#1a0d2e', fog:true});
  const deck = new THREE.Mesh(new THREE.BoxGeometry(14, 0.12, 0.4), bridgeMat);
  deck.position.set(0, -0.3, -16);
  g.add(deck);
  for (let i=-3;i<=3;i++){
    const cable = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.9, 0.06), bridgeMat);
    cable.position.set(i*1.6, 0.15, -16);
    g.add(cable);
  }
  const tower1 = new THREE.Mesh(new THREE.BoxGeometry(0.18, 1.6, 0.18), bridgeMat);
  tower1.position.set(-3.2, 0.5, -16); g.add(tower1);
  const tower2 = tower1.clone(); tower2.position.x = 3.2; g.add(tower2);

  return g;
}
scene.add(makeSkyline());

// =============================================================
// FLOWER CLOUDS — colorful daisy-shaped clouds floating in the sky
// =============================================================
const flowerClouds = new THREE.Group();
scene.add(flowerClouds);

function makeFlowerCloud(petalColor, centerColor, scale) {
  const g = new THREE.Group();
  const petalMat = new THREE.MeshStandardMaterial({
    color: petalColor, roughness: 0.6, emissive: petalColor, emissiveIntensity: 0.18, flatShading:false
  });
  const centerMat = new THREE.MeshStandardMaterial({
    color: centerColor, roughness: 0.5, emissive: centerColor, emissiveIntensity: 0.25
  });
  // 6 petals as squashed spheres around a center
  const nPetals = 6;
  for (let i = 0; i < nPetals; i++) {
    const a = (i / nPetals) * Math.PI * 2;
    const petal = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 12), petalMat);
    petal.scale.set(1.0, 0.6, 0.5);
    petal.position.set(Math.cos(a) * 0.7, Math.sin(a) * 0.7, 0);
    petal.rotation.z = a;
    g.add(petal);
  }
  // back petals (offset) for a fluffier look
  for (let i = 0; i < nPetals; i++) {
    const a = (i / nPetals) * Math.PI * 2 + Math.PI / nPetals;
    const petal = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 12), petalMat);
    petal.scale.set(1.0, 0.6, 0.5);
    petal.position.set(Math.cos(a) * 0.55, Math.sin(a) * 0.55, -0.1);
    petal.rotation.z = a;
    g.add(petal);
  }
  // center pollen ball
  const center = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 12), centerMat);
  g.add(center);
  // tiny highlight on center
  const hl = new THREE.Mesh(new THREE.SphereGeometry(0.10, 8, 6),
    new THREE.MeshStandardMaterial({color:'#ffffff', emissive:'#ffffff', emissiveIntensity:0.4}));
  hl.position.set(-0.1, 0.1, 0.25);
  g.add(hl);

  g.scale.setScalar(scale);
  return g;
}

const flowerPalettes = [
  { petal:'#ff6fb8', center:'#fff36a' }, // hot pink + yellow
  { petal:'#ffd3a0', center:'#ff5a86' }, // peach + magenta
  { petal:'#ffffff', center:'#ff8fc8' }, // white + pink
  { petal:'#c9a8ff', center:'#fff36a' }, // lavender + yellow
  { petal:'#ffb347', center:'#ff3aa0' }, // orange + hot pink
  { petal:'#fff36a', center:'#ff5a86' }, // yellow + magenta
  { petal:'#ff9ed1', center:'#ffffff' }, // baby pink + white
];

const cloudData = [];
const NUM_CLOUDS = 14;
for (let i = 0; i < NUM_CLOUDS; i++) {
  const pal = flowerPalettes[i % flowerPalettes.length];
  const scale = 0.9 + Math.random() * 1.4;
  const cloud = makeFlowerCloud(pal.petal, pal.center, scale);

  // distribute around the scene at varying heights and distances
  const angle = (i / NUM_CLOUDS) * Math.PI * 2 + Math.random() * 0.4;
  const radius = 11 + Math.random() * 8;
  const height = 4 + Math.random() * 7;
  cloud.position.set(Math.cos(angle) * radius, height, Math.sin(angle) * radius - 2);
  cloud.rotation.z = Math.random() * Math.PI * 2;
  // face roughly toward center
  cloud.lookAt(0, height, 0);
  cloud.userData = {
    basePos: cloud.position.clone(),
    spinSpeed: (Math.random() - 0.5) * 0.4,
    bobPhase: Math.random() * Math.PI * 2,
    bobAmp: 0.3 + Math.random() * 0.5,
    driftPhase: Math.random() * Math.PI * 2,
  };
  flowerClouds.add(cloud);
  cloudData.push(cloud);
}

// also a tight cluster of smaller flower-clouds near the hot pink sun
for (let i = 0; i < 6; i++) {
  const pal = flowerPalettes[(i + 2) % flowerPalettes.length];
  const cloud = makeFlowerCloud(pal.petal, pal.center, 0.6 + Math.random() * 0.5);
  // sun is at sky x:0.62, y:0.78 of canvas — translate to a sky-area in 3D
  // We'll just place these on the sun-side of the scene
  const ang = -0.6 + Math.random() * 1.2;
  const r = 14 + Math.random() * 4;
  const yy = 5 + Math.random() * 4;
  cloud.position.set(Math.cos(ang) * r, yy, -Math.sin(ang) * r - 2);
  cloud.lookAt(0, yy, 0);
  cloud.userData = {
    basePos: cloud.position.clone(),
    spinSpeed: (Math.random() - 0.5) * 0.6,
    bobPhase: Math.random() * Math.PI * 2,
    bobAmp: 0.2 + Math.random() * 0.4,
    driftPhase: Math.random() * Math.PI * 2,
  };
  flowerClouds.add(cloud);
  cloudData.push(cloud);
}

function updateFlowerClouds(t) {
  cloudData.forEach((c, i) => {
    const u = c.userData;
    c.position.y = u.basePos.y + Math.sin(t * 0.5 + u.bobPhase) * u.bobAmp;
    c.position.x = u.basePos.x + Math.sin(t * 0.3 + u.driftPhase) * 0.3;
    c.rotation.z += u.spinSpeed * 0.005;
  });
}

// =============================================================
// KATELYN — cutout image as a billboard sprite (glasses, locked)
// =============================================================
const loader = new THREE.TextureLoader();
const texGlasses = loader.load('katelyn-final.png');
texGlasses.colorSpace = THREE.SRGBColorSpace;
texGlasses.anisotropy = 8;

// The cutouts: 344x1104 ratio. We want her ~3.0 units tall.
const charH = 3.0;
const charAspect = 344 / 1104;
const charW = charH * charAspect;

const katelynGroup = new THREE.Group();
katelynGroup.position.set(0, 1.1 + charH/2 - 0.05, 0); // feet near grass
islandGroup.add(katelynGroup);

const planeGeo = new THREE.PlaneGeometry(charW, charH);
const matKatelyn = new THREE.MeshBasicMaterial({ map: texGlasses, transparent:true, alphaTest:0.02, side: THREE.DoubleSide, depthWrite:false });
const planeKatelyn = new THREE.Mesh(planeGeo, matKatelyn);
katelynGroup.add(planeKatelyn);

// ground shadow under her feet (soft elliptical patch)
{
  const shadowCanvas = document.createElement('canvas');
  shadowCanvas.width = shadowCanvas.height = 128;
  const sctx = shadowCanvas.getContext('2d');
  const grd = sctx.createRadialGradient(64,64,0,64,64,60);
  grd.addColorStop(0,'rgba(0,0,0,0.55)');
  grd.addColorStop(1,'rgba(0,0,0,0)');
  sctx.fillStyle = grd; sctx.fillRect(0,0,128,128);
  const stex = new THREE.CanvasTexture(shadowCanvas);
  const charShadow = new THREE.Mesh(
    new THREE.PlaneGeometry(1.4, 0.7),
    new THREE.MeshBasicMaterial({ map: stex, transparent:true, depthWrite:false })
  );
  charShadow.rotation.x = -Math.PI/2;
  charShadow.position.set(0, 1.08, 0.08);
  islandGroup.add(charShadow);
}

// DOGS — keep as 3D
function makePomeranian() {
  const g = new THREE.Group();
  const fluff = new THREE.MeshStandardMaterial({color:'#1a1a1a', roughness:1});
  const skin = new THREE.MeshStandardMaterial({color:'#0a0a0a', roughness:1});

  const body1 = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 12), fluff);
  body1.position.y = 0.18; body1.castShadow = true; g.add(body1);
  const body2 = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), fluff);
  body2.position.set(0.13, 0.2, 0); g.add(body2);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 12), fluff);
  head.position.set(0.26, 0.28, 0); head.castShadow = true; g.add(head);
  const muz = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 10), skin);
  muz.position.set(0.36, 0.24, 0); g.add(muz);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.022, 10, 8), new THREE.MeshStandardMaterial({color:'#000'}));
  nose.position.set(0.40, 0.26, 0); g.add(nose);
  const eyeMat = new THREE.MeshStandardMaterial({color:'#1a0a05', roughness:0.3});
  const eL = new THREE.Mesh(new THREE.SphereGeometry(0.018,8,6), eyeMat);
  eL.position.set(0.32, 0.32, 0.07); g.add(eL);
  const eR = eL.clone(); eR.position.z = -0.07; g.add(eR);
  const ear = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.1, 4), fluff);
  ear.position.set(0.22, 0.42, 0.08); ear.rotation.z = -0.3; g.add(ear);
  const ear2 = ear.clone(); ear2.position.z = -0.08; g.add(ear2);
  const tail = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10), fluff);
  tail.position.set(-0.17, 0.32, 0); g.add(tail);

  function leg(x, z) {
    const L = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.035, 0.14, 8), fluff);
    L.position.set(x, 0.07, z); return L;
  }
  const legs = [leg(0.10,0.10), leg(0.10,-0.10), leg(-0.10,0.10), leg(-0.10,-0.10)];
  legs.forEach(l => g.add(l));
  g.userData.legs = legs;
  g.userData.head = head;
  return g;
}

function makePug() {
  const g = new THREE.Group();
  const fawn = new THREE.MeshStandardMaterial({color:'#d6a76a', roughness:0.85});
  const dark = new THREE.MeshStandardMaterial({color:'#3a2418', roughness:0.9});

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.20, 18, 14), fawn);
  body.scale.set(1.3, 1.0, 1.0); body.position.y = 0.18; body.castShadow = true; g.add(body);
  const chest = new THREE.Mesh(new THREE.SphereGeometry(0.13, 14, 10), fawn);
  chest.position.set(0.2, 0.16, 0); g.add(chest);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 18, 14), fawn);
  head.position.set(0.34, 0.26, 0); head.castShadow = true; g.add(head);

  const mask = new THREE.Mesh(new THREE.SphereGeometry(0.105, 14, 10), dark);
  mask.scale.set(1.1, 0.85, 1.0); mask.position.set(0.42, 0.22, 0); g.add(mask);
  const muz = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 10), dark);
  muz.position.set(0.48, 0.22, 0); g.add(muz);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.024, 10, 8), new THREE.MeshStandardMaterial({color:'#000'}));
  nose.position.set(0.51, 0.235, 0); g.add(nose);
  const eyeMat = new THREE.MeshStandardMaterial({color:'#1a0a05'});
  const eyeWhite = new THREE.MeshStandardMaterial({color:'#ffffff'});
  function pugEye(z){
    const w = new THREE.Mesh(new THREE.SphereGeometry(0.034, 10, 8), eyeWhite);
    w.position.set(0.39, 0.3, z); g.add(w);
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.025, 10, 8), eyeMat);
    e.position.set(0.405, 0.3, z); g.add(e);
  }
  pugEye(0.08); pugEye(-0.08);

  const earL = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), dark);
  earL.scale.set(0.6, 1.4, 0.4); earL.position.set(0.3, 0.36, 0.12); earL.rotation.z = 0.5; g.add(earL);
  const earR = earL.clone(); earR.position.z = -0.12; g.add(earR);

  const tail = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.022, 8, 12, Math.PI*1.5), fawn);
  tail.position.set(-0.2, 0.28, 0); tail.rotation.y = Math.PI/2; g.add(tail);

  function leg(x, z) {
    const L = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.045, 0.16, 8), fawn);
    L.position.set(x, 0.08, z); return L;
  }
  const legs = [leg(0.16,0.10), leg(0.16,-0.10), leg(-0.14,0.10), leg(-0.14,-0.10)];
  legs.forEach(l => g.add(l));
  g.userData.legs = legs;
  g.userData.head = head;
  return g;
}

const pom = makePomeranian();
const pug = makePug();
islandGroup.add(pom);
islandGroup.add(pug);

// ground shadow under island
{
  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(3.2, 32),
    new THREE.MeshBasicMaterial({color:'#1a0d2e', transparent:true, opacity:0.25, fog:false})
  );
  shadow.rotation.x = -Math.PI/2;
  shadow.position.y = -3.2;
  scene.add(shadow);
}

// fireflies
const fireflies = new THREE.Group();
scene.add(fireflies);
{
  const ffMat = new THREE.MeshBasicMaterial({color:'#fff4a8', transparent:true, opacity:0.9, fog:false});
  for (let i=0;i<40;i++){
    const f = new THREE.Mesh(new THREE.SphereGeometry(0.025, 6, 5), ffMat);
    f.position.set((Math.random()-0.5)*8, Math.random()*4 + 0.5, (Math.random()-0.5)*8);
    f.userData.phase = Math.random()*Math.PI*2;
    f.userData.speed = 0.5 + Math.random()*0.8;
    f.userData.base = f.position.clone();
    fireflies.add(f);
  }
}

// ANIMATION
const clock = new THREE.Clock();

function ease(t){ return 0.5 - 0.5*Math.cos(Math.PI*t); }

function updateKatelyn(t) {
  // billboard: face camera (Y rotation only so she stays upright)
  const camPos = new THREE.Vector3();
  camera.getWorldPosition(camPos);
  const localCam = islandGroup.worldToLocal(camPos.clone());
  const dx = localCam.x - katelynGroup.position.x;
  const dz = localCam.z - katelynGroup.position.z;
  katelynGroup.rotation.y = Math.atan2(dx, dz);

  // gentle bob
  const bob = Math.sin(t*1.2)*0.06;
  katelynGroup.position.y = (1.1 + charH/2 - 0.05) + bob;
  // slight side-to-side sway for life
  katelynGroup.rotation.z = Math.sin(t*0.9)*0.015;

}

function updateIsland(t) {
  islandGroup.position.y = Math.sin(t*0.6)*0.18;
  islandGroup.rotation.y = Math.sin(t*0.2)*0.05;
}

function updateDog(dog, t, params) {
  const { radius, speed, phase, yBob, scale } = params;
  const angle = t * speed + phase;
  const x = Math.cos(angle) * radius;
  const z = Math.sin(angle) * radius;
  dog.position.set(x, 1.15 + Math.abs(Math.sin(t*speed*4 + phase))*yBob, z);
  const tangent = Math.atan2(Math.cos(angle) * speed, -Math.sin(angle) * speed);
  dog.rotation.y = tangent + Math.PI/2;
  dog.scale.setScalar(scale);
  const legs = dog.userData.legs;
  if (legs) {
    legs.forEach((L, i) => {
      L.rotation.x = Math.sin(t*speed*8 + phase + i*Math.PI/2) * 0.6;
    });
  }
  if (dog.userData.head) {
    if (dog.userData.head.userData.baseY === undefined) {
      dog.userData.head.userData.baseY = dog.userData.head.position.y;
    }
    dog.userData.head.position.y = dog.userData.head.userData.baseY + Math.sin(t*speed*8 + phase)*0.02;
  }
}

function updateFireflies(t) {
  fireflies.children.forEach(f => {
    const b = f.userData.base;
    f.position.x = b.x + Math.sin(t * f.userData.speed + f.userData.phase) * 0.6;
    f.position.y = b.y + Math.cos(t * f.userData.speed * 0.7 + f.userData.phase)*0.5;
    f.position.z = b.z + Math.sin(t * f.userData.speed * 0.5 + f.userData.phase*1.3)*0.6;
    f.material.opacity = 0.4 + 0.5 * (0.5 + 0.5*Math.sin(t*3 + f.userData.phase));
  });
}

function tick() {
  const t = clock.getElapsedTime();
  updateIsland(t);
  updateKatelyn(t);
  updateFlowerClouds(t);
  updateDog(pom, t, { radius: 1.7, speed: 1.2, phase: 0,        yBob: 0.06, scale: 0.85 });
  updateDog(pug, t, { radius: 2.0, speed: -0.9, phase: Math.PI, yBob: 0.05, scale: 0.95 });
  updateFireflies(t);

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Katelyn — NOLA Sunset</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0b0414; overflow:hidden; font-family: ui-monospace, Menlo, monospace; color:#fff; }
  #c { display:block; width:100vw; height:100vh; }
  .label {
    position: fixed; left: 18px; bottom: 16px;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #ffd9f1; opacity: 0.85; mix-blend-mode: screen;
    pointer-events: none;
  }
  .label b { color:#fff; font-weight:600; letter-spacing:0.22em;}
  .hint {
    position: fixed; right: 18px; bottom: 16px;
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #ffd9f1; opacity: 0.55; pointer-events:none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label"><b>Katelyn</b> &nbsp;·&nbsp; new orleans, sunset</div>
<div class="hint">drag to look · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ------------------------------------------------------------------
// renderer / scene / camera
// ------------------------------------------------------------------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(5.6, 3.6, 9.2);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 5;
controls.maxDistance = 18;
controls.minPolarAngle = 0.4;
controls.maxPolarAngle = Math.PI / 2 + 0.05;
controls.enablePan = false;

// ------------------------------------------------------------------
// SKY — quirky multi-stop gradient with painted cloud puffs
// ------------------------------------------------------------------
function makeSkyTexture() {
  const w = 1024, h = 1024;
  const canv = document.createElement('canvas');
  canv.width = w; canv.height = h;
  const ctx = canv.getContext('2d');

  // vertical gradient: deep periwinkle → magenta → coral → tangerine → buttery glow at horizon
  const grd = ctx.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0.00, '#1a1145');   // upper night
  grd.addColorStop(0.18, '#3b1d6b');   // violet
  grd.addColorStop(0.38, '#a23a8a');   // magenta
  grd.addColorStop(0.55, '#ef5d6a');   // coral
  grd.addColorStop(0.72, '#ff9c52');   // tangerine
  grd.addColorStop(0.86, '#ffd58a');   // butter
  grd.addColorStop(1.00, '#ffe7b0');   // glow horizon
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, w, h);

  // sprinkle stars high up
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 90; i++) {
    const y = Math.random() * h * 0.28;
    const x = Math.random() * w;
    const r = Math.random() * 1.4 + 0.3;
    ctx.globalAlpha = 0.4 + Math.random() * 0.55;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // quirky painted cloud puffs — soft horizontal smears
  function puff(cx, cy, rx, ry, color, alpha) {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
    g.addColorStop(0, color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(cx, cy);
    ctx.scale(rx / 100, ry / 100);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 100, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // pink low clouds
  puff(180, 640, 320, 70, '#ffc6e0', 0.85);
  puff(540, 600, 380, 80, '#ffd9b8', 0.9);
  puff(820, 660, 260, 60, '#ffb3c1', 0.8);
  puff(330, 720, 260, 50, '#ffe0c2', 0.95);
  puff(720, 740, 300, 55, '#ffd2a8', 0.95);
  // higher lavender wisps
  puff(140, 380, 240, 38, '#d6b6ff', 0.55);
  puff(620, 420, 300, 40, '#e5b8ff', 0.5);
  puff(880, 460, 200, 35, '#c9a8ff', 0.45);
  // tiny popcorn clouds
  for (let i = 0; i < 14; i++) {
    puff(Math.random()*w, 500 + Math.random()*250,
         40 + Math.random()*60, 14 + Math.random()*16,
         '#fff1d9', 0.4 + Math.random()*0.3);
  }

  // fat low sun
  const sunY = h * 0.84, sunX = w * 0.62;
  const sunGlow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 280);
  sunGlow.addColorStop(0, 'rgba(255, 240, 200, 1)');
  sunGlow.addColorStop(0.25, 'rgba(255, 200, 140, 0.9)');
  sunGlow.addColorStop(0.55, 'rgba(255, 140, 110, 0.5)');
  sunGlow.addColorStop(1, 'rgba(255, 120, 130, 0)');
  ctx.fillStyle = sunGlow;
  ctx.beginPath(); ctx.arc(sunX, sunY, 280, 0, Math.PI*2); ctx.fill();
  // sun core
  const core = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 90);
  core.addColorStop(0, '#fff8e2');
  core.addColorStop(1, '#ffce6b');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(sunX, sunY, 90, 0, Math.PI*2); ctx.fill();

  const tex = new THREE.CanvasTexture(canv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.mapping = THREE.EquirectangularReflectionMapping;
  return tex;
}

// dome sky
{
  const skyGeo = new THREE.SphereGeometry(80, 48, 32);
  const skyMat = new THREE.MeshBasicMaterial({
    map: makeSkyTexture(),
    side: THREE.BackSide,
    depthWrite: false,
  });
  const sky = new THREE.Mesh(skyGeo, skyMat);
  sky.rotation.y = Math.PI * 0.15;
  scene.add(sky);
}

scene.fog = new THREE.Fog('#f3a07a', 28, 80);

// ------------------------------------------------------------------
// LIGHTS — golden-hour mood
// ------------------------------------------------------------------
const hemi = new THREE.HemisphereLight('#ffd9b3', '#3a2255', 0.85);
scene.add(hemi);

const sun = new THREE.DirectionalLight('#ffb98a', 1.6);
sun.position.set(7, 5, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 30;
sun.shadow.camera.left = -8;
sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8;
sun.shadow.camera.bottom = -8;
sun.shadow.bias = -0.0005;
scene.add(sun);

const rim = new THREE.DirectionalLight('#ff7ab8', 0.55);
rim.position.set(-5, 3, -4);
scene.add(rim);

const fill = new THREE.PointLight('#a07cff', 0.4, 18);
fill.position.set(-3, 2.4, 3);
scene.add(fill);

// ------------------------------------------------------------------
// procedural textures
// ------------------------------------------------------------------
function makeLeopardTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#d9a062'; ctx.fillRect(0,0,256,256);
  // soft mottle
  for (let i=0;i<80;i++){
    ctx.fillStyle = `rgba(193,140,70,${0.18+Math.random()*0.2})`;
    ctx.beginPath();
    ctx.arc(Math.random()*256, Math.random()*256, 18+Math.random()*22, 0, Math.PI*2);
    ctx.fill();
  }
  // spots
  for (let i=0;i<55;i++){
    const x = Math.random()*256, y = Math.random()*256;
    const r = 6 + Math.random()*8;
    ctx.fillStyle = '#3a2410';
    ctx.beginPath();
    // broken ring
    for (let a=0;a<6;a++){
      const ang = (a/6)*Math.PI*2 + Math.random()*0.6;
      ctx.moveTo(x+Math.cos(ang)*r, y+Math.sin(ang)*r);
      ctx.arc(x+Math.cos(ang)*r, y+Math.sin(ang)*r, 2+Math.random()*1.6, 0, Math.PI*2);
    }
    ctx.fill();
    // brown center blob
    ctx.fillStyle = '#7a4a1f';
    ctx.beginPath();
    ctx.ellipse(x, y, r*0.55, r*0.45, Math.random()*Math.PI, 0, Math.PI*2);
    ctx.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2,2);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function makeFaceTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const ctx = c.getContext('2d');
  // skin base
  ctx.fillStyle = '#f4d3b5'; ctx.fillRect(0,0,512,512);
  // soft cheek blush
  function blush(cx,cy,r,col){
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  }
  blush(150, 300, 70, 'rgba(255,150,170,0.55)');
  blush(362, 300, 70, 'rgba(255,150,170,0.55)');

  // eyes — wide chibi
  function eye(cx, cy){
    // white
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(cx, cy, 36, 44, 0, 0, Math.PI*2); ctx.fill();
    // iris
    ctx.fillStyle = '#3b2a55';
    ctx.beginPath(); ctx.ellipse(cx, cy+4, 22, 28, 0, 0, Math.PI*2); ctx.fill();
    // pupil
    ctx.fillStyle = '#0d0820';
    ctx.beginPath(); ctx.ellipse(cx, cy+6, 12, 18, 0, 0, Math.PI*2); ctx.fill();
    // catchlight
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(cx-7, cy-6, 6, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+8, cy+10, 3, 4, 0, 0, Math.PI*2); ctx.fill();
    // top lashes
    ctx.strokeStyle = '#0a0612'; ctx.lineWidth = 5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(cx-34, cy-32); ctx.quadraticCurveTo(cx, cy-58, cx+34, cy-30); ctx.stroke();
    // lash flicks
    ctx.lineWidth = 3;
    for (let i=0;i<5;i++){
      const t = i/4;
      const x = cx - 30 + t*60;
      const y = cy - 40 + Math.sin(t*Math.PI)*-10;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (i-2)*2, y - 14 - Math.sin(t*Math.PI)*4); ctx.stroke();
    }
  }
  eye(170, 250);
  eye(342, 250);

  // brows — thin
  ctx.strokeStyle = '#1a0e22'; ctx.lineWidth = 4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(135,200); ctx.quadraticCurveTo(170,188,205,200); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(307,200); ctx.quadraticCurveTo(342,188,377,200); ctx.stroke();

  // nose hint
  ctx.strokeStyle = 'rgba(180,120,110,0.5)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(256, 305); ctx.quadraticCurveTo(252, 325, 260, 335); ctx.stroke();

  // lips
  ctx.fillStyle = '#c8456a';
  ctx.beginPath();
  ctx.moveTo(220, 380);
  ctx.quadraticCurveTo(240, 365, 256, 378);
  ctx.quadraticCurveTo(272, 365, 292, 380);
  ctx.quadraticCurveTo(272, 400, 256, 396);
  ctx.quadraticCurveTo(240, 400, 220, 380);
  ctx.fill();
  // lip highlight
  ctx.fillStyle = 'rgba(255,220,220,0.6)';
  ctx.beginPath(); ctx.ellipse(256, 378, 14, 3, 0, 0, Math.PI*2); ctx.fill();

  // STARS — face decals
  function star(cx, cy, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i=0;i<10;i++){
      const ang = (i/10)*Math.PI*2 - Math.PI/2;
      const rr = i%2===0 ? r : r*0.45;
      const x = cx + Math.cos(ang)*rr;
      const y = cy + Math.sin(ang)*rr;
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.fill();
    // outline
    ctx.strokeStyle = '#1a0e22'; ctx.lineWidth = 1.4; ctx.stroke();
  }
  star( 95, 230, 11, '#fff8d8');
  star(112, 305, 9,  '#ffd6e6');
  star(150, 360, 8,  '#fff8d8');
  star( 80, 360, 7,  '#ffd6e6');
  star(420, 230, 11, '#fff8d8');
  star(402, 305, 9,  '#ffd6e6');
  star(360, 365, 8,  '#fff8d8');
  star(432, 360, 7,  '#ffd6e6');

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function makeGrassTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#5fa84a'; ctx.fillRect(0,0,256,256);
  for (let i=0;i<2200;i++){
    const x = Math.random()*256, y = Math.random()*256;
    const shades = ['#7cc862','#3f8a36','#a8d76f','#4d9a3e','#6bb84f'];
    ctx.strokeStyle = shades[i % shades.length];
    ctx.lineWidth = 0.8 + Math.random()*0.7;
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x + (Math.random()-0.5)*1.5, y - 2 - Math.random()*2);
    ctx.stroke();
  }
  // tiny flowers
  for (let i=0;i<24;i++){
    const x = Math.random()*256, y = Math.random()*256;
    ctx.fillStyle = ['#ffd1e8','#fff4a0','#ffffff','#ffb6e1'][i%4];
    ctx.beginPath(); ctx.arc(x,y,1.4,0,Math.PI*2); ctx.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(3,3);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// ------------------------------------------------------------------
// FLOATING ISLAND
// ------------------------------------------------------------------
const islandGroup = new THREE.Group();
scene.add(islandGroup);

// rocky underside (squashed cone)
{
  const rockGeo = new THREE.ConeGeometry(2.6, 2.8, 16, 4, false);
  // jiggle vertices for chunk feel
  const pos = rockGeo.attributes.position;
  for (let i=0;i<pos.count;i++){
    const y = pos.getY(i);
    if (y < 1.0) {
      pos.setX(i, pos.getX(i) + (Math.random()-0.5)*0.25);
      pos.setZ(i, pos.getZ(i) + (Math.random()-0.5)*0.25);
      pos.setY(i, y + (Math.random()-0.5)*0.18);
    }
  }
  rockGeo.computeVertexNormals();
  const rockMat = new THREE.MeshStandardMaterial({ color:'#6b4a3a', roughness:0.95, flatShading:true });
  const rock = new THREE.Mesh(rockGeo, rockMat);
  rock.position.y = -0.4;
  rock.rotation.y = Math.PI;
  rock.castShadow = true; rock.receiveShadow = true;
  islandGroup.add(rock);
}

// little dangling roots
for (let i=0;i<6;i++){
  const ang = (i/6)*Math.PI*2;
  const len = 0.4 + Math.random()*0.5;
  const root = new THREE.Mesh(
    new THREE.CylinderGeometry(0.04, 0.01, len, 6),
    new THREE.MeshStandardMaterial({color:'#3a2418', roughness:1})
  );
  root.position.set(Math.cos(ang)*1.6, -1.5 - len/2, Math.sin(ang)*1.6);
  root.rotation.z = (Math.random()-0.5)*0.3;
  islandGroup.add(root);
}

// grass top — a flat squashed cylinder
{
  const grassGeo = new THREE.CylinderGeometry(2.7, 2.55, 0.45, 32);
  const grassMat = new THREE.MeshStandardMaterial({
    map: makeGrassTexture(), roughness: 0.9, color:'#8fcf6c'
  });
  const grass = new THREE.Mesh(grassGeo, grassMat);
  grass.position.y = 0.85;
  grass.receiveShadow = true; grass.castShadow = true;
  islandGroup.add(grass);

  // grass blade shells
  for (let i=0;i<60;i++){
    const r = Math.random() * 2.4;
    const a = Math.random()*Math.PI*2;
    const blade = new THREE.Mesh(
      new THREE.ConeGeometry(0.04, 0.18 + Math.random()*0.12, 4),
      new THREE.MeshStandardMaterial({color: ['#7cc862','#5fa84a','#a8d76f'][i%3], roughness:1})
    );
    blade.position.set(Math.cos(a)*r, 1.15, Math.sin(a)*r);
    blade.rotation.z = (Math.random()-0.5)*0.4;
    islandGroup.add(blade);
  }

  // a couple of tiny flowers (sphere on stem)
  for (let i=0;i<7;i++){
    const r = 0.5 + Math.random()*1.7;
    const a = Math.random()*Math.PI*2;
    const stem = new THREE.Mesh(
      new THREE.CylinderGeometry(0.02,0.02,0.18,5),
      new THREE.MeshStandardMaterial({color:'#3f8a36'})
    );
    stem.position.set(Math.cos(a)*r, 1.18, Math.sin(a)*r);
    islandGroup.add(stem);
    const flower = new THREE.Mesh(
      new THREE.SphereGeometry(0.07, 8, 6),
      new THREE.MeshStandardMaterial({color: ['#ffd1e8','#fff4a0','#ffb6e1','#ffffff'][i%4], roughness:0.7})
    );
    flower.position.set(stem.position.x, 1.32, stem.position.z);
    islandGroup.add(flower);
  }
}

// ------------------------------------------------------------------
// NEW ORLEANS SKYLINE — silhouettes far behind + below
// ------------------------------------------------------------------
function makeSkyline() {
  const g = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color: '#2a1840', fog: true });
  const matFar = new THREE.MeshBasicMaterial({ color: '#52315e', fog: true });

  // distant skyline ring
  const ringR = 22;
  const buildings = [
    // shotgun row, low pitched roofs
    { type:'shotgun', x:-9, w:1.6, h:1.2 },
    { type:'shotgun', x:-7, w:1.4, h:1.0 },
    { type:'shotgun', x:-5.4, w:1.5, h:1.1 },
    { type:'shotgun', x:-3.6, w:1.6, h:1.3 },
    // cathedral with 3 spires (St Louis-ish)
    { type:'cathedral', x:-1.4, w:2.4, h:2.4 },
    // tall office block
    { type:'office', x:1.8, w:1.0, h:3.4 },
    { type:'office', x:3.0, w:1.2, h:3.0 },
    { type:'office', x:4.4, w:0.9, h:2.6 },
    // riverboat smokestacks
    { type:'boat', x:6.6, w:2.6, h:1.6 },
    { type:'shotgun', x:9.4, w:1.5, h:1.1 },
  ];

  buildings.forEach(b => {
    const angle = Math.atan2(b.x, ringR);
    const px = Math.sin(angle) * ringR;
    const pz = -Math.cos(angle) * ringR;

    if (b.type === 'shotgun') {
      const body = new THREE.Mesh(new THREE.BoxGeometry(b.w, b.h, 0.6), mat);
      body.position.set(px, b.h/2 - 0.5, pz);
      g.add(body);
      // pitched roof (triangular prism via squashed cone)
      const roof = new THREE.Mesh(new THREE.ConeGeometry(b.w*0.78, 0.5, 4), mat);
      roof.rotation.y = Math.PI/4;
      roof.position.set(px, b.h - 0.5 + 0.25, pz);
      g.add(roof);
      // chimney
      const chim = new THREE.Mesh(new THREE.BoxGeometry(0.12,0.4,0.12), mat);
      chim.position.set(px - b.w*0.3, b.h - 0.3, pz);
      g.add(chim);
    } else if (b.type === 'cathedral') {
      const body = new THREE.Mesh(new THREE.BoxGeometry(b.w, b.h*0.7, 0.8), mat);
      body.position.set(px, b.h*0.35 - 0.5, pz);
      g.add(body);
      // gable
      const gable = new THREE.Mesh(new THREE.ConeGeometry(b.w*0.6, 0.5, 3), mat);
      gable.rotation.y = Math.PI/6;
      gable.position.set(px, b.h*0.7 - 0.5 + 0.25, pz);
      g.add(gable);
      // 3 spires
      for (let s=-1;s<=1;s++) {
        const spire = new THREE.Mesh(new THREE.ConeGeometry(0.18, 1.4 + (s===0?0.4:0), 8), mat);
        spire.position.set(px + s*b.w*0.4, b.h*0.7 - 0.5 + 0.7 + (s===0?0.2:0), pz);
        g.add(spire);
      }
    } else if (b.type === 'office') {
      const body = new THREE.Mesh(new THREE.BoxGeometry(b.w, b.h, 0.7), matFar);
      body.position.set(px, b.h/2 - 0.5, pz);
      g.add(body);
      // roof box
      const cap = new THREE.Mesh(new THREE.BoxGeometry(b.w*0.5, 0.25, 0.4), matFar);
      cap.position.set(px, b.h - 0.5 + 0.12, pz);
      g.add(cap);
    } else if (b.type === 'boat') {
      const hull = new THREE.Mesh(new THREE.BoxGeometry(b.w, b.h*0.6, 0.8), mat);
      hull.position.set(px, b.h*0.3 - 0.5, pz);
      g.add(hull);
      const tier = new THREE.Mesh(new THREE.BoxGeometry(b.w*0.7, b.h*0.4, 0.7), mat);
      tier.position.set(px, b.h*0.6 - 0.5 + b.h*0.2, pz);
      g.add(tier);
      // 2 smokestacks
      const s1 = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.12,1.0,8), mat);
      s1.position.set(px-0.4, b.h*0.6 + 0.5, pz);
      g.add(s1);
      const s2 = s1.clone(); s2.position.x = px+0.4; g.add(s2);
      // crowns
      [s1, s2].forEach(s => {
        const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.12,0.18,8), mat);
        crown.position.set(s.position.x, s.position.y+0.55, s.position.z);
        g.add(crown);
      });
    }
  });

  // a couple scattered tiny twinkles in skyline as window lights
  const lightMat = new THREE.MeshBasicMaterial({color:'#ffe9a8'});
  for (let i=0;i<40;i++){
    const x = -10 + Math.random()*20;
    const y = 0.2 + Math.random()*2.2;

// ------------------------------------------------------------------
const clock = new THREE.Clock();

// helper
function smoothstep(t) { return t*t*(3 - 2*t); }
function ease(t){ return 0.5 - 0.5*Math.cos(Math.PI*t); }

function updateGlasses(t) {
  // 6-second cycle: hold off (1.0s) → lift up to forehead (1.0s) → hold up (1.0s) → put back (1.0s) → hold on (2.0s)
  const cycle = 6.0;
  const tt = (t % cycle) / cycle;
  // phases as 0..1 t values
  let lift = 0; // 0 = on face, 1 = on top of head
  let handLift = 0; // 0 = arm at rest, 1 = arm at face

  if (tt < 1/6) {
    lift = 0;
    handLift = 0;
  } else if (tt < 2/6) {
    const u = (tt - 1/6) / (1/6);
    handLift = ease(u);
    // glasses move with hand from u=0.4 onward
    lift = u < 0.35 ? 0 : ease((u - 0.35)/0.65);
  } else if (tt < 3/6) {
    lift = 1;
    handLift = 1;
  } else if (tt < 4/6) {
    const u = (tt - 3/6) / (1/6);
    handLift = 1; // hand stays up while bringing them down
    lift = 1 - u < 0.65 ? ease(1 - (u/0.65)) : 0;
    // simpler: lift goes 1 -> 0 over u 0..0.65
    if (u < 0.65) lift = 1 - ease(u/0.65);
    else lift = 0;
    // hand drops in last part
    if (u > 0.55) handLift = 1 - ease((u - 0.55)/0.45);
    else handLift = 1;
  } else {
    lift = 0;
    handLift = 0;
  }

  // glasses transform
  // base: y=0.07, z=0.51 (on face). Lifted: y=0.45 (top of head), z=0.32 (slightly back), tilted.
  const baseY = 0.07, baseZ = 0.51;
  const upY = 0.45, upZ = 0.20;
  glasses.position.y = THREE.MathUtils.lerp(baseY, upY, lift);
  glasses.position.z = THREE.MathUtils.lerp(baseZ, upZ, lift);
  glasses.rotation.x = THREE.MathUtils.lerp(0, -0.9, lift);

  // RIGHT arm reaches up to glasses
  // shoulder is at (0.46, 1.78, 0). When handLift=0 arm hangs.
  // When handLift=1 hand approximates head face area: ~ (0.05, 2.45, 0.45)
  // We achieve this by rotating armR around its shoulder (X axis) and bending elbow.
  armR.rotation.x = THREE.MathUtils.lerp(0, -1.85, handLift);
  armR.rotation.z = THREE.MathUtils.lerp(-0.18, -0.5, handLift);
  armR.userData.forearmGroup.rotation.x = THREE.MathUtils.lerp(0, -1.0, handLift);

  // left arm subtle counter
  armL.rotation.z = 0.18 + Math.sin(t*1.3)*0.04;
  armL.userData.forearmGroup.rotation.x = Math.sin(t*1.5)*0.06;
}

function updateCharacter(t) {
  // gentle breathing
  character.position.y = 1.1 + Math.sin(t*1.2)*0.04;
  // slight head sway
  headGroup.rotation.y = Math.sin(t*0.6)*0.18;
  headGroup.rotation.z = Math.sin(t*0.9)*0.04;
  // hair / curls bob already shows via head movement
  // top wiggle
  topGroup.rotation.y = Math.sin(t*0.6)*0.05;
}

function updateIsland(t) {
  islandGroup.position.y = Math.sin(t*0.6)*0.18;
  islandGroup.rotation.y = Math.sin(t*0.2)*0.05;
}

function updateDog(dog, t, params) {
  const { radius, speed, phase, yBob, scale } = params;
  const angle = t * speed + phase;
  const x = Math.cos(angle) * radius;
  const z = Math.sin(angle) * radius;
  dog.position.set(x, 1.15 + Math.abs(Math.sin(t*speed*4 + phase))*yBob, z);
  // face direction of motion (tangent)
  const tangent = Math.atan2(Math.cos(angle) * speed, -Math.sin(angle) * speed);
  dog.rotation.y = tangent + Math.PI/2;
  dog.scale.setScalar(scale);
  // wiggle legs
  const legs = dog.userData.legs;
  if (legs) {
    legs.forEach((L, i) => {
      L.rotation.x = Math.sin(t*speed*8 + phase + i*Math.PI/2) * 0.6;
    });
  }
  // head bob
  if (dog.userData.head) {
    dog.userData.head.position.y = (dog.userData.head.userData.baseY ?? dog.userData.head.position.y);
    if (dog.userData.head.userData.baseY === undefined) {
      dog.userData.head.userData.baseY = dog.userData.head.position.y;
    }
    dog.userData.head.position.y = dog.userData.head.userData.baseY + Math.sin(t*speed*8 + phase)*0.02;
  }
}

function updateFireflies(t) {
  fireflies.children.forEach(f => {
    const b = f.userData.base;
    f.position.x = b.x + Math.sin(t * f.userData.speed + f.userData.phase) * 0.6;
    f.position.y = b.y + Math.cos(t * f.userData.speed * 0.7 + f.userData.phase)*0.5;
    f.position.z = b.z + Math.sin(t * f.userData.speed * 0.5 + f.userData.phase*1.3)*0.6;
    f.material.opacity = 0.4 + 0.5 * (0.5 + 0.5*Math.sin(t*3 + f.userData.phase));
  });
}

function tick() {
  const t = clock.getElapsedTime();
  updateGlasses(t);
  updateCharacter(t);
  updateIsland(t);
  updateDog(pom, t, { radius: 1.7, speed: 1.2, phase: 0,        yBob: 0.06, scale: 0.85 });
  updateDog(pug, t, { radius: 2.0, speed: -0.9, phase: Math.PI, yBob: 0.05, scale: 0.95 });
  updateFireflies(t);

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

// ------------------------------------------------------------------
// resize
// ------------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
